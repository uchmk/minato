name: Checklists

# TESTING-CHECKS.md follows TESTING.md. Not
# skipped for Markdown, unlike CI: a change to TESTING.md alone is what it
# is for.
on:
  push:
    branches: [main]
    paths: ['TESTING*.md', 'crates/minato/examples/**', '.github/workflows/checklists.yml']
  pull_request:
    paths: ['TESTING*.md', 'crates/minato/examples/**', '.github/workflows/checklists.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p minato --example make-testcheck -- --check
