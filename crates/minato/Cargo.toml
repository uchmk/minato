[package]
name = "minato"
description = "A keyboard-driven GitHub client for issues, PRs, Actions and Projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `minato-com` (src/bin/minato-com.rs) makes two binaries, and a bare
# `cargo run` would not know which one to start.
default-run = "minato"

# The checklist generator; its own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }

[dependencies]
minato-core = { path = "../minato-core" }
# Every ito crate at the same rev as tsumugi and kura.
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e", features = ["edit"] }
ito-common = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e", features = ["clock", "egui"] }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-help = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-palette = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-layout = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e", features = ["egui"] }
ito-browser = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-select = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-notify = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
# `minato.com` (src/bin/minato-com.rs) and the answers `say` writes.
ito-console = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
# eframe's own defaults, but for `winit/default` (see tsumugi): the Wayland
# frame is drawn without the title's text, which brings an unmaintained crate.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = "0.36"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "9d7e6151fba49679172de14320384d859b24317e" }
